name: Deploy to GitHub Pages

on:
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Le runtime .NET WASM sert le jeu depuis _framework/ ; le prefixe souligne est aussi
  # la raison du .nojekyll ci-dessous, Jekyll ignorant ces dossiers.
  APP_BUNDLE: SettlersOfIdlestanAvalonia.Browser/bin/Release/net10.0-browser/browser-wasm/AppBundle

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      # Pas de -o : le SDK WASM y aplatit tout le contenu intermediaire. Le bundle
      # deployable est AppBundle, produit a un emplacement fixe.
      - name: Publish
        run: dotnet publish SettlersOfIdlestanAvalonia.Browser/SettlersOfIdlestanAvalonia.Browser.csproj -c Release

      # Plus de reecriture de <base href> : contrairement au head Blazor, la page
      # d'Avalonia n'utilise que des chemins relatifs et fonctionne telle quelle
      # dans le sous-dossier de GitHub Pages.

      - name: Add .nojekyll
        run: touch $APP_BUNDLE/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.APP_BUNDLE }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
